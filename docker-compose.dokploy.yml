# Production/staging Docker Compose for Dokploy.
#
# Differences from the local docker-compose.yml:
#   - No host port bindings. Traefik (managed by Dokploy) owns 80/443; we only
#     `expose` internal ports and attach web-facing services to dokploy-network.
#     For web/keycloak/authentik, assign public domains in the Dokploy UI
#     (Domains tab) — it injects the Traefik labels for you. Map:
#         web        -> ${APP_DOMAIN}  port 3000
#         keycloak   -> ${IDP_DOMAIN}  port 8080   (keycloak profile)
#         authentik  -> ${IDP_DOMAIN}  port 9000   (authentik profile)
#     ZITADEL is the EXCEPTION: do NOT add its domain in the UI. zitadel-api and
#     zitadel-login below carry hand-written Traefik labels (h2c on the API,
#     path-based routing across the two backends). Just set IDP_DOMAIN; see
#     GUIDE.md §7.9.
#   - The app runs under gunicorn with PY_ENV=production (set via entrypoint).
#   - All secrets/domains come from Dokploy environment variables (see
#     .env.dokploy.example).
#
# Deploy ONE identity provider per stack:
#   docker compose -f docker-compose.dokploy.yml --profile keycloak  up -d
#   docker compose -f docker-compose.dokploy.yml --profile authentik up -d
#   docker compose -f docker-compose.dokploy.yml --profile zitadel   up -d
# IMPORTANT (Dokploy): there is no --profile CLI flag in the UI. You MUST set
#   COMPOSE_PROFILES=keycloak   (or: authentik, or: zitadel)
# in the Environment tab, or NO services start and the deploy fails with
# "No such container: select-a-container". To run more than one, create separate
# Compose services, one per profile.

networks:
  # Created by Dokploy; Traefik routes traffic over it.
  dokploy-network:
    external: true
  internal:

volumes:
  keycloak-db-data:
  authentik-db-data:
  authentik-redis-data:
  zitadel-db-data:
  zitadel-bootstrap:        # shared API<->Login PAT bridge (see ZITADEL block)

services:
  # ----------------------------------------------------------------------- #
  # Django app (shared by both profiles)                                     #
  # ----------------------------------------------------------------------- #
  web:
    build: .
    profiles: [keycloak, authentik, zitadel]
    restart: unless-stopped
    networks: [dokploy-network, internal]
    expose:
      - "3000"
    environment:
      PY_ENV: production
      PORT: "3000"
      WEB_CONCURRENCY: "3"
      ALLOWED_HOSTS: ${APP_DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${APP_DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_DURATION: "3600"
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME}
      # Public issuer of the chosen IdP, e.g.
      #   Keycloak : https://${IDP_DOMAIN}/realms/demo
      #   Authentik: https://${IDP_DOMAIN}/application/o/django
      #   ZITADEL  : https://${IDP_DOMAIN}            (host root, no path)
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_CALLBACK_URL: https://${APP_DOMAIN}/auth/callback
      OIDC_POST_LOGIN_URL: /profile
      OIDC_POST_LOGOUT_URL: https://${APP_DOMAIN}/auth/logout/callback
    # If your host can't hairpin the public IdP domain back to Traefik,
    # uncomment and point it at the host gateway:
    # extra_hosts:
    #   - "${IDP_DOMAIN}:host-gateway"

  # ----------------------------------------------------------------------- #
  # Keycloak                                                                 #
  # ----------------------------------------------------------------------- #
  keycloak-db:
    image: postgres:16-alpine
    profiles: [keycloak]
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    profiles: [keycloak]
    restart: unless-stopped
    networks: [dokploy-network, internal]
    # Production mode (not start-dev). TLS is terminated at Traefik, which
    # forwards HTTP + X-Forwarded-* headers to Keycloak.
    command: start --import-realm --optimized=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Public issuer URL — must match OIDC_ISSUER's host on the app.
      KC_HOSTNAME: https://${IDP_DOMAIN}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-demo.json:/opt/keycloak/data/import/realm-demo.json:ro
    expose:
      - "8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

  # ----------------------------------------------------------------------- #
  # Authentik                                                                #
  # ----------------------------------------------------------------------- #
  authentik-db:
    image: postgres:16-alpine
    profiles: [authentik]
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AK_DB_PASSWORD}
    volumes:
      - authentik-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-redis:
    image: redis:7-alpine
    profiles: [authentik]
    restart: unless-stopped
    networks: [internal]
    command: --save 60 1 --loglevel warning
    volumes:
      - authentik-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.12
    profiles: [authentik]
    restart: unless-stopped
    networks: [dokploy-network, internal]
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AK_DB_PASSWORD}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AK_ADMIN_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AK_BOOTSTRAP_TOKEN}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AK_ADMIN_EMAIL}
      # Consumed by the blueprint to set the provider's redirect URIs + secret.
      APP_BASE_URL: https://${APP_DOMAIN}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    expose:
      - "9000"
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.12
    profiles: [authentik]
    restart: unless-stopped
    networks: [internal]
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AK_DB_PASSWORD}
      AUTHENTIK_REDIS__HOST: authentik-redis
      # The WORKER runs the one-time bootstrap that creates the akadmin user.
      # These MUST be present here too (not only on authentik-server) or the
      # admin is created with a random password and AK_ADMIN_PASSWORD is ignored.
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AK_ADMIN_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AK_BOOTSTRAP_TOKEN}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AK_ADMIN_EMAIL}
      APP_BASE_URL: https://${APP_DOMAIN}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
  # ----------------------------------------------------------------------- #
  # ZITADEL  (api + login + postgres; profile: zitadel)                      #
  #                                                                          #
  # Unlike Keycloak/Authentik this is TWO web backends behind one domain,    #
  # split by path via the hand-written Traefik labels below:                 #
  #   zitadel-api   (Go,      :8080, h2c)  -> /api, and everything that is    #
  #                                          NOT the login UI or bare /       #
  #   zitadel-login (Next.js, :3000, http) -> /  and /ui/v2/login            #
  # Do NOT assign this domain in the Dokploy UI — these labels own routing.  #
  # `redirect-to-https@file` is Dokploy's global HTTP->HTTPS middleware.     #
  # ----------------------------------------------------------------------- #
  zitadel-db:
    image: postgres:17-alpine        # ZITADEL upstream pins PG17 (others here use 16)
    profiles: [zitadel]
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD}
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 5s
      timeout: 5s
      retries: 10

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.13.0
    profiles: [zitadel]
    restart: unless-stopped
    user: "0"                          # upstream runs as root (bootstrap-volume perms)
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}"
    networks: [dokploy-network, internal]
    environment:
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: ${IDP_DOMAIN}
      ZITADEL_EXTERNALPORT: "443"                  # public port = Traefik 443
      ZITADEL_EXTERNALSECURE: "true"               # public URL is https
      ZITADEL_TLS_ENABLED: "false"                 # TLS terminated at Traefik
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:${ZITADEL_DB_PASSWORD}@zitadel-db:5432/zitadel?sslmode=disable
      # --- First-instance bootstrap (ONE-SHOT; applied only on an empty DB) ---
      # Login name to use is <username>@zitadel.<IDP_DOMAIN>  (org "ZITADEL" => "zitadel").
      # Password must satisfy default complexity: >=8 chars, upper+lower+number+symbol.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      # --- Login V2 wiring: API mints a PAT to the shared volume; Login reads it ---
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${ZITADEL_PAT_EXPIRATION}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${IDP_DOMAIN}:443/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${IDP_DOMAIN}:443/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${IDP_DOMAIN}:443/ui/v2/login/logout?post_logout_redirect=
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    expose:
      - "8080"
    depends_on:
      zitadel-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.zitadel-api.loadbalancer.server.port=8080
      - traefik.http.services.zitadel-api.loadbalancer.server.scheme=h2c          # <-- the h2c label
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.prefixes=/api
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.forceSlash=false
      # /api alias -> API (strip /api)                 priority 200
      - traefik.http.routers.zitadel-api-alias.rule=Host(`${IDP_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.zitadel-api-alias.entrypoints=websecure
      - traefik.http.routers.zitadel-api-alias.tls.certresolver=letsencrypt
      - traefik.http.routers.zitadel-api-alias.middlewares=zitadel-strip-api
      - traefik.http.routers.zitadel-api-alias.service=zitadel-api
      - traefik.http.routers.zitadel-api-alias.priority=200
      # catch-all -> API (everything except login UI, /api, bare /)   priority 100
      - traefik.http.routers.zitadel-canonical.rule=Host(`${IDP_DOMAIN}`) && !PathPrefix(`/ui/v2/login`) && !PathPrefix(`/api`) && !Path(`/`)
      - traefik.http.routers.zitadel-canonical.entrypoints=websecure
      - traefik.http.routers.zitadel-canonical.tls.certresolver=letsencrypt
      - traefik.http.routers.zitadel-canonical.service=zitadel-api
      - traefik.http.routers.zitadel-canonical.priority=100
      # HTTP -> HTTPS redirect (single catch-all on the web entrypoint)
      - traefik.http.routers.zitadel-redirect.rule=Host(`${IDP_DOMAIN}`)
      - traefik.http.routers.zitadel-redirect.entrypoints=web
      - traefik.http.routers.zitadel-redirect.middlewares=redirect-to-https@file
      - traefik.http.routers.zitadel-redirect.service=zitadel-api

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.13.0
    profiles: [zitadel]
    restart: unless-stopped
    user: "0"
    networks: [dokploy-network, internal]
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080       # internal; API serves HTTP/1.1 + h2c on same port
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:${IDP_DOMAIN},X-Forwarded-Proto:https
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    expose:
      - "3000"
    depends_on:
      zitadel-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.zitadel-login.loadbalancer.server.port=3000         # plain HTTP, NO h2c
      # bare / -> 302 redirect to the Console. Hitting the login UI directly (no
      # auth request) strands you on /ui/v2/login/signedin; sending root to the
      # Console makes IT initiate the auth request, so login returns there.
      # End users are unaffected: they always arrive via an auth request from the
      # app (/ui/v2/login/login?authRequest=...), never at the bare root.
      # Static replacement (no regex backreference) => no $$ escaping needed;
      # ${IDP_DOMAIN} is interpolated by Compose. The router below already filters
      # to Path(`/`), so `.*` only ever matches the root URL.
      - traefik.http.middlewares.zitadel-root-redirect.redirectregex.regex=.*
      - traefik.http.middlewares.zitadel-root-redirect.redirectregex.replacement=https://${IDP_DOMAIN}/ui/console/
      - traefik.http.routers.zitadel-root.rule=Host(`${IDP_DOMAIN}`) && Path(`/`)
      - traefik.http.routers.zitadel-root.entrypoints=websecure
      - traefik.http.routers.zitadel-root.tls.certresolver=letsencrypt
      - traefik.http.routers.zitadel-root.middlewares=zitadel-root-redirect
      - traefik.http.routers.zitadel-root.service=zitadel-login
      - traefik.http.routers.zitadel-root.priority=400
      # /ui/v2/login -> Login                      priority 250
      - traefik.http.routers.zitadel-login.rule=Host(`${IDP_DOMAIN}`) && PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.zitadel-login.entrypoints=websecure
      - traefik.http.routers.zitadel-login.tls.certresolver=letsencrypt
      - traefik.http.routers.zitadel-login.service=zitadel-login
      - traefik.http.routers.zitadel-login.priority=250